<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15171c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Strength Start</title>
</head>
<body>
  <div id="update" class="update" hidden>
    <span>A new version is ready.</span>
    <button type="button">Reload</button>
  </div>

  <main id="app"></main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="timer" class="timer" hidden></div>

  <nav>
    <button type="button" data-action="tab" data-tab="today">Today</button>
    <button type="button" data-action="tab" data-tab="plan">Plan</button>
    <button type="button" data-action="tab" data-tab="settings">Settings</button>
  </nav>

  <script type="module" src="js/main.js"></script>
</body>
</html>
