<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15171c">
  <meta name="description" content="A short home strength program for beginners, with timers, water tracking and reminders.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Strength Start</title>
</head>
<body>
  <div id="update" class="update" hidden>
    <span>A new version is ready.</span>
    <button type="button">Reload</button>
  </div>

  <main id="app"></main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="timer" class="timer" role="timer" hidden>
    <div class="timer-main">
      <span class="timer-label"></span>
      <b class="timer-left"></b>
    </div>
    <div class="timer-next" hidden></div>
    <div class="timer-buttons">
      <button type="button" data-action="add-time" hidden>+15s</button>
      <button type="button" data-action="skip"></button>
    </div>
  </div>

  <nav aria-label="Sections">
    <button type="button" data-action="tab" data-tab="today">Today</button>
    <button type="button" data-action="tab" data-tab="plan">Plan</button>
    <button type="button" data-action="tab" data-tab="settings">Settings</button>
  </nav>

  <div id="player" class="player" role="dialog" aria-modal="true" aria-labelledby="player-title" hidden>
    <div class="player-sheet">
      <div class="player-head">
        <h2 id="player-title"></h2>
        <button type="button" class="player-close" data-action="close-video" aria-label="Close video">✕</button>
      </div>
      <div class="player-frame"></div>
      <p class="player-by"></p>
      <p class="cue player-cue"></p>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
